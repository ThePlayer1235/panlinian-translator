<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="img/icon.ico" type="image/x-icon">
    <title>Panlinian Translator</title>
</head>
<body>
    <h1 class="title">Panlinian Translator</h1>
    <div class="main-wrapper">
        <div class="sub-wrapper">
            <h2 class="sub-title">English to Panlinian</h2>
            <textarea type="text" class="input" id="english-input" placeholder="english goes here"></textarea>
            <button class="button" id="convert-to-panlinian">Translate</button>
            <div class="output-wrapper">
                <textarea type="text" class="input" id="panlinian-output" readonly></textarea>
                <button class="button copy-button" id="panlinian-copy">Copy</button>
            </div>
        </div>
        <div class="sub-wrapper">
            <h2 class="sub-title">Panlinian to English</h2>
            <textarea type="text" class="input" id="panlinian-input" placeholder="panlinian goes here"></textarea>
            <button class="button" id="convert-to-english">Translate</button>
            <div class="output-wrapper">
                <textarea type="text" class="input" id="english-output" readonly></textarea>
                <button class="button copy-button" id="english-copy">Copy</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
